<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-label="go2rtc /api/streams feeds Sync Camera Shortcuts every 5 minutes, which writes one command per camera into a Script folder; Raycast Root Search runs one, and Open Camera opens the go2rtc player or your preferred app"><title>go2rtc /api/streams feeds Sync Camera Shortcuts every 5 minutes, which writes one command per camera into a Script folder; Raycast Root Search runs one, and Open Camera opens the go2rtc player or your preferred app</title>
<rect width="100%" height="100%" fill="#000000"/>
<rect x="40" y="170" width="230" height="170" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="155.0" y="245.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">go2rtc</text><text x="155.0" y="287.0" font-family="IBM Plex Mono" font-size="22" font-weight="400" text-anchor="middle" fill="#8A8F8C">/api/streams</text><text x="155.0" y="392" font-family="Instrument Sans" font-size="24" font-weight="400" text-anchor="middle" fill="#8A8F8C">camera names</text><path d="M282 255.0 H308 M299 248.0 L308 255.0 L299 262.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="170" width="230" height="170" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="435.0" y="245.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Sync Camera</text><text x="435.0" y="287.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Shortcuts</text><text x="435.0" y="392" font-family="Instrument Sans" font-size="24" font-weight="400" text-anchor="middle" fill="#8A8F8C">every 5 minutes</text><path d="M562 255.0 H588 M579 248.0 L588 255.0 L579 262.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="170" width="230" height="170" rx="16" fill="none" stroke="#37E7A2" stroke-width="2.5"/><text x="715.0" y="245.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Script folder</text><text x="715.0" y="287.0" font-family="IBM Plex Mono" font-size="22" font-weight="400" text-anchor="middle" fill="#8A8F8C">root-search-</text><text x="715.0" y="392" font-family="Instrument Sans" font-size="24" font-weight="400" text-anchor="middle" fill="#8A8F8C">one per camera</text><path d="M842 255.0 H868 M859 248.0 L868 255.0 L859 262.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="880" y="170" width="230" height="170" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="995.0" y="245.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Raycast</text><text x="995.0" y="287.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Root Search</text><text x="995.0" y="392" font-family="Instrument Sans" font-size="24" font-weight="400" text-anchor="middle" fill="#8A8F8C">you press Return</text><path d="M1122 255.0 H1148 M1139 248.0 L1148 255.0 L1139 262.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1160" y="170" width="230" height="170" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="1275.0" y="266.0" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Open Camera</text><text x="1275.0" y="392" font-family="Instrument Sans" font-size="24" font-weight="400" text-anchor="middle" fill="#8A8F8C">reads your settings</text><text x="715.0" y="313.0" font-family="IBM Plex Mono" font-size="22" font-weight="400" text-anchor="middle" fill="#8A8F8C">commands</text><path d="M1390 255 H1420 M1420 175 V335" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1420 175 H1450 M1441 168 L1450 175 L1441 182" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1420 335 H1450 M1441 328 L1450 335 L1441 342" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1460" y="120" width="300" height="110" rx="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="1610" y="168" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">go2rtc player</text><text x="1610" y="204" font-family="Instrument Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#8A8F8C">in your browser</text><rect x="1460" y="280" width="300" height="110" rx="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="1610" y="328" font-family="Instrument Sans" font-size="30" font-weight="400" text-anchor="middle" fill="#FFFFFF">Preferred app</text><text x="1610" y="364" font-family="Instrument Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#8A8F8C">MP4, HLS or RTSP</text><text x="900" y="530" font-family="Instrument Sans" font-size="26" font-weight="400" text-anchor="middle" fill="#FFFFFF">Each command holds a camera name and a Raycast deeplink. Never the go2rtc address, never a login.</text>
